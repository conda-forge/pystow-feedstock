# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.10.3"
  # check an explict version instead of `*`
  python_check_max: "3.14"

package:
  name: pystow
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pystow/pystow-${{ version }}.tar.gz
  sha256: 09276e0eeff99069eec1cc6ca24a0e90e4202981d98b2783c2a7c7bb323f8817

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pystow = pystow.cli:main
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - uv-build >=0.6.6,<1.0
  run:
    # this is a no-op on python >=3.14
    - backports.zstd
    - python >=${{ python_min }}
    - tqdm
    - typing_extensions

tests:
  - package_contents:
      strict: true
      site_packages:
        - pystow/**
        - pystow-${{ version }}.dist-info/**
  - python:
      imports: pystow
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - click
        - pip
        - python ${{ python_min }}.*
    script:
      - pystow --help

about:
  summary: Easily pick a place to store data for your Python code
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pystow
  repository: https://github.com/cthoyt/pystow
  documentation: https://pystow.readthedocs.io

extra:
  recipe-maintainers:
    - cthoyt
    - bollwyvl
